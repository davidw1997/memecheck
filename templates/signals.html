{% extends "base.html" %}
{% block content %}

<h1>Signals Dashboard</h1>

{% for item in signal_items %}
<div class="report-box glass-card">
    <h3>{{ item.token_name }}</h3>

    <ul>
        {% for signal in item.signals %}
        <li>{{ signal }}</li>
        {% endfor %}
    </ul>
</div>
{% endfor %}

{% endblock %}
