{% extends "base.html" %}
{% block content %}

<h1>Watchlist</h1>

{% for item in watchlist_items %}
<div class="report-box glass-card">
    <h3>{{ item.token_name }}</h3>
    <p>{{ item.address }}</p>
    <p>Price: {{ item.current_price_usd }}</p>

    <a href="/reanalyze/{{ item.id }}">Re-analyze</a>
</div>
{% endfor %}

{% endblock %}
