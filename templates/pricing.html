{% extends "base.html" %}
{% block content %}

<section class="section-head">
    <h1>Pricing</h1>
</section>

<div class="pricing-grid">

    <div class="pricing-card glass-card">
        <h3>Free</h3>
        <p>$0</p>
        <ul>
            <li>Basic analysis</li>
            <li>Limited usage</li>
        </ul>
    </div>

    <div class="pricing-card featured glass-card">
        <h3>Pro</h3>
        <p>$9.99/month</p>

        <ul>
            <li>Unlimited analysis</li>
            <li>Signals dashboard</li>
            <li>Hype detection</li>
            <li>Rug check</li>
        </ul>

        {% if is_pro_user %}
            <form method="POST" action="/create-billing-portal-session">
                <button>Manage Subscription</button>
            </form>
        {% else %}
            <form method="POST" action="/create-checkout-session">
                <button>Upgrade</button>
            </form>
        {% endif %}
    </div>

</div>

{% endblock %}
